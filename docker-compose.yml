services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigeti_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/sigeti
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: sigeti_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigeti
    volumes:
      - sigeti_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sigeti_db_data:
